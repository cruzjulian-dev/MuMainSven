; MU 0.97k presentation (docs/superpowers/specs/2026-10-23-interface97-theme-design.md). Every
; file this folder doesn't provide comes from legacy -- every window the 0.97k client never had
; keeps the Sven look on purpose. The guild window (G) is the Season 3 client's classic one
; (2026-10-24-guild-s3-classic-design.md). The 0.97k art lives in Data/Interface97/,
; referenced from this theme's stylesheets as "../../../../Interface97/<file>".
[Theme]
Base=legacy

; Declared theme capabilities (architecture-principles.md §30). NativeTextSize comes from legacy;
; NearestFiltering=1 draws every image with nearest instead of linear filtering, the sharp look of
; the 0.97k art when the UI is scaled. Fonts and item previews stay smooth. ChatLogModes=1 gives the
; chat the 0.97k client's two modes, the history on the left and the framed box over the input box:
; F5 switches them and F4 cycles the current one's height (five steps) whether or not the player
; types, each mode keeps its own height, and the box stays up when typing ends. F2 shows or hides the
; chat, and while nobody types the chat's buttons sit over the closed input box
; (chat_frame_buttons.rcss). WhisperStartsOff=1 starts each character with whispering off, the
; recipient field red: F3 or the ear switches it on. ClassicWorldHud=1 draws the world labels as the
; 0.97k client did: a party member's HP hover text in the tooltip box, no bar under the selected
; monster's name. Which game systems there are (the master skill tree, the friend list, the window
; menu, the in-game shop, Gens, the chat command list, the fourth potion box) is the build's, not the
; theme's: src/source/Core/Globals/ClientProfile.h.
; ClassicLoginScene=1 makes the login scene the 0.97k client's: three ships at sea under the 3D MU
; logo, seen from its camera walk in a 640x320 strip between black bars, with no music.
; ClassicCharacterCreation=1 makes character creation the 0.97k client's New Character panel: the
; class's face (Data/Logo/Face01..04, face05 for the dark lord) picked with arrows among the dark
; wizard, dark knight, elf, magic gladiator and dark lord. ClassicCharacterScene=1 makes the
; character scene the 0.97k client's: the characters on the stone yard of Logo05
; (Data/Interface97/Logo/), seen from that client's camera, instead of the character world.
; ClassicHitNumbers=1 draws the damage and "Miss" over the characters from Data/Interface97/Fonttest,
; ProEmulator's 4x redraw of FontTest, sampled like that client: nearest, no mip levels.
; ClassicFontControls=1 gives the text the 0.97k client's one fixed size, whatever the window's size,
; and the options its size (cell height, 13 by default), bold, italic and reset rows.
[Capabilities]
ClassicFontControls=1
NearestFiltering=1
ChatLogModes=1
WhisperStartsOff=1
ClassicWorldHud=1
ClassicLoginScene=1
ClassicCharacterCreation=1
ClassicCharacterScene=1
ClassicHitNumbers=1

; The 0.97k client drew its chat input box over the bar (y 415 to 444, the bar from 432), so the box
; draws over the HUD (main_frame.rml, 10.6), still under the chat command list (10.65); the EXP
; digit it drew over the box is main_frame_top.rml's, drawn over both.
[Stacking]
chat_input.rml=10.62
main_frame_top.rml=10.63

; Read by UI::RmlBridge::GetThemeDisplayName() -- the label COptionWindow's UI Theme dropdown
; shows for this theme.
[Meta]
DisplayName=MU 0.97k
