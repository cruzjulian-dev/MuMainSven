; MU 0.97k presentation (docs/superpowers/specs/2026-10-23-interface97-theme-design.md). Every
; file this folder doesn't provide comes from legacy -- the guild window (G) and every window the
; 0.97k client never had keep the Sven look on purpose. The 0.97k art lives in Data/Interface97/,
; referenced from this theme's stylesheets as "../../../../Interface97/<file>".
[Theme]
Base=legacy

; Declared theme capabilities (architecture-principles.md §30). NativeTextSize comes from legacy;
; NearestFiltering=1 draws every image with nearest instead of linear filtering, the sharp look of
; the 0.97k art when the UI is scaled. Fonts and item previews stay smooth. ChatLogModes=1 gives the
; chat the 0.97k client's two modes, the history on the left and the framed box over the input box:
; F5 switches them and F4 cycles the current one's height (five steps) whether or not the player
; types, each mode keeps its own height, and the box stays up when typing ends. F2 shows or hides the
; chat, and while nobody types the chat's buttons sit over the closed input box
; (chat_frame_buttons.rcss). WhisperStartsOff=1 starts each character with whispering off, the
; recipient field red: F3 or the ear switches it on. ClassicWorldHud=1 draws the world labels as the
; 0.97k client did: a party member's HP hover text in the tooltip box, no bar under the selected
; monster's name.
[Capabilities]
NearestFiltering=1
ChatLogModes=1
WhisperStartsOff=1
ClassicWorldHud=1

; The 0.97k client drew its chat input box over the bar (y 415 to 444, the bar from 432), so the box
; draws over the HUD (main_frame.rml, 10.6), still under the chat command list (10.65); the EXP
; digit it drew over the box is main_frame_top.rml's, drawn over both.
[Stacking]
chat_input.rml=10.62
main_frame_top.rml=10.63

; Read by UI::RmlBridge::GetThemeDisplayName() -- the label COptionWindow's UI Theme dropdown
; shows for this theme.
[Meta]
DisplayName=MU 0.97k
