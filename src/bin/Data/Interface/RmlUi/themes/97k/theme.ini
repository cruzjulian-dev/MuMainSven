; MU 0.97k presentation (docs/superpowers/specs/2026-10-23-interface97-theme-design.md). Every
; file this folder doesn't provide comes from legacy -- the guild window (G) and every window the
; 0.97k client never had keep the Sven look on purpose. The 0.97k art lives in Data/Interface97/,
; referenced from this theme's stylesheets as "../../../../Interface97/<file>".
[Theme]
Base=legacy

; Declared theme capabilities (architecture-principles.md §30). NativeTextSize comes from legacy;
; NearestFiltering=1 draws every image with nearest instead of linear filtering, the sharp look of
; the 0.97k art when the UI is scaled. Fonts and item previews stay smooth.
[Capabilities]
NearestFiltering=1

; Read by UI::RmlBridge::GetThemeDisplayName() -- the label COptionWindow's UI Theme dropdown
; shows for this theme.
[Meta]
DisplayName=MU 0.97k
