; Design tokens for the `97k` theme (theming-and-modding.md, "Design tokens"). Keys inherit one by
; one from legacy's tokens.ini; list a key here only when the 0.97k client used a different value,
; with the 0.97k constant it comes from.
[Tokens]

; The digit strip the 0.97k numbers are drawn from (decorator: digit-strip, RmlDigitStripDecorator.h):
; Data/Interface97/Font97 is 256x32, the ten digits on a 16-texel pitch from x 0 in rows 1..17
; ("Miss" below them). The 14x17 window from +1 holds the widest digit with a texel to spare on
; each side, so linear filtering never picks up the neighbour's edge. Relative to this
; folder's stylesheets.
font97-strip=../../../../Interface97/Font97.tga 16 1 1 14 17
